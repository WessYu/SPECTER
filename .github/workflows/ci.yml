name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20.11.1, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify lockfile generation
        run: test -s pnpm-lock.yaml

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Portfolio smoke validation
        run: pnpm smoke

      - name: Verify CLI package contents
        if: matrix.node == '20.11.1'
        run: |
          mkdir -p artifacts
          pnpm --filter @specter-security/cli pack --pack-destination "$PWD/artifacts"
          tar -tzf artifacts/*.tgz | sort

      - name: Upload generated lockfile
        if: matrix.node == '20.11.1'
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
