name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [20.11.1, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/specter
        run: pnpm --filter @specter/api prisma:generate

      - name: Format check
        id: format
        continue-on-error: true
        run: pnpm format:check

      - name: Lint
        id: lint
        continue-on-error: true
        run: pnpm lint

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: pnpm typecheck

      - name: Unit and integration tests
        id: test
        continue-on-error: true
        run: pnpm test

      - name: Active scanner tests
        id: active-test
        continue-on-error: true
        run: pnpm test:active

      - name: Build
        id: build
        continue-on-error: true
        run: pnpm build

      - name: Portfolio smoke validation
        id: smoke
        continue-on-error: true
        run: pnpm smoke

      - name: Active security smoke validation
        id: active-smoke
        continue-on-error: true
        run: pnpm smoke:active

      - name: Verify CLI package contents
        id: package
        if: matrix.node == '20.11.1'
        continue-on-error: true
        run: |
          mkdir -p artifacts
          pnpm --filter @specter-security/cli pack --pack-destination "$PWD/artifacts"
          tar -tzf artifacts/*.tgz | sort

      - name: Execute bundled GitHub Action
        id: action-smoke
        if: matrix.node == '20.11.1'
        continue-on-error: true
        env:
          INPUT_TARGET: examples/secure-next
          INPUT_FAIL_ON: high
          INPUT_MAX_SCORE_DROP: "5"
          INPUT_OFFLINE: "true"
        run: |
          node integrations/github-action/dist/index.js
          test -s .specter/report.json

      - name: Upload bundled GitHub Action
        if: matrix.node == '20.11.1'
        uses: actions/upload-artifact@v4
        with:
          name: github-action-dist
          path: integrations/github-action/dist/index.js
          if-no-files-found: error
          retention-days: 7

      - name: Enforce validation result
        if: always()
        env:
          FORMAT: ${{ steps.format.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TEST: ${{ steps.test.outcome }}
          ACTIVE_TEST: ${{ steps.active-test.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          ACTIVE_SMOKE: ${{ steps.active-smoke.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          ACTION_SMOKE: ${{ steps.action-smoke.outcome }}
        run: |
          printf 'format=%s\nlint=%s\ntypecheck=%s\ntest=%s\nactive-test=%s\nbuild=%s\nsmoke=%s\nactive-smoke=%s\npackage=%s\naction-smoke=%s\n' \
            "$FORMAT" "$LINT" "$TYPECHECK" "$TEST" "$ACTIVE_TEST" "$BUILD" "$SMOKE" "$ACTIVE_SMOKE" "$PACKAGE" "$ACTION_SMOKE"
          for outcome in "$FORMAT" "$LINT" "$TYPECHECK" "$TEST" "$ACTIVE_TEST" "$BUILD" "$SMOKE" "$ACTIVE_SMOKE"; do
            if [ "$outcome" != "success" ]; then
              exit 1
            fi
          done
          if [ "${{ matrix.node }}" = "20.11.1" ]; then
            if [ "$PACKAGE" != "success" ] || [ "$ACTION_SMOKE" != "success" ]; then
              exit 1
            fi
          fi

  windows-smoke:
    name: Windows smoke (Node 24)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npx --yes pnpm@10.17.1 install --frozen-lockfile

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/specter
        run: npx --yes pnpm@10.17.1 --filter @specter/api prisma:generate

      - name: Build
        run: npx --yes pnpm@10.17.1 build

      - name: Portfolio smoke validation
        run: npx --yes pnpm@10.17.1 smoke

      - name: Active security smoke validation
        run: npx --yes pnpm@10.17.1 smoke:active

  database-integration:
    name: PostgreSQL API integration
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: specter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d specter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/specter
      SPECTER_INTEGRATION_DATABASE: "1"
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @specter/api prisma:generate
      - name: Apply migrations
        run: pnpm --filter @specter/api prisma:deploy
      - name: Build API workspace dependencies
        run: |
          pnpm --filter @specter/types build
          pnpm --filter @specter/core build
          pnpm --filter @specter/config build
          pnpm --filter @specter/risk-engine build
          pnpm --filter @specter/scanner-web build
          pnpm --filter @specter/scanner-active build
      - name: Run API integration tests
        run: pnpm --filter @specter/api test
