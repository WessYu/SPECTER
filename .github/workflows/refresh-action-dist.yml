name: Refresh GitHub Action bundle

on:
  push:
    branches:
      - release-hardening

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release-hardening

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build distributable action
        run: pnpm --filter @specter-security/github-action build

      - name: Commit generated bundle
        run: |
          git add -f integrations/github-action/dist/index.js
          if git diff --cached --quiet; then
            echo "GitHub Action bundle is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(action): refresh distributable bundle [skip ci]"
          git push origin HEAD:release-hardening
