name: Format README Preview

on:
  push:
    branches:
      - docs/readme-redesign

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Format README
        run: npx --yes prettier@3.9.6 --write README.md
      - name: Print formatted README
        run: |
          echo "===FORMATTED_README_START==="
          cat README.md
          echo "===FORMATTED_README_END==="
